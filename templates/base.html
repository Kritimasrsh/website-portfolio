{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Portfolio of Kritima Shrestha, Python and Django Developer."
    >

    <title>
        {% block title %}
        Kritima Shrestha | Portfolio
        {% endblock %}
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>

<body>

    <header class="navbar">

        <div class="nav-container">

            <a
                href="{% url 'main:home' %}"
                class="brand"
            >
                <div class="brand-logo">
                    <img
                        src="{% static 'images/kritima.jpg' %}"
                        alt="Kritima Shrestha"
                        class="brand-profile-image"
                    >
                </div>

                <span class="brand-name">
                    Kritima Shrestha
                </span>
            </a>


            <nav
                class="nav-links"
                id="navLinks"
            >
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#skills">Skills</a>
                <a href="#projects">Projects</a>
                <a href="#blog">Blog</a>
                <a href="#contact">Contact</a>
            </nav>


            <div class="nav-actions">

                <button
                    class="theme-toggle"
                    id="themeToggle"
                    type="button"
                    aria-label="Toggle dark mode"
                >
                    ☾
                </button>

                <a
                    href="#contact"
                    class="contact-button"
                >
                    Get in touch
                </a>

                <button
                    class="menu-toggle"
                    id="menuToggle"
                    type="button"
                    aria-label="Open navigation"
                    aria-expanded="false"
                >
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

            </div>

        </div>

    </header>


    {% block content %}
    {% endblock %}


    <script src="{% static 'js/main.js' %}"></script>

</body>
</html>
