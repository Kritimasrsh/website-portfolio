{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="{% block meta_description %}Kritima Shrestha - Python and Django Developer portfolio.{% endblock %}"
    >

    <title>
        {% block title %}Kritima Shrestha | Python & Django Developer{% endblock %}
    </title>

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- css -->
    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

    {% block extra_css %}{% endblock %}
</head>


<body>

    <!-- navbar -->
    <header class="navbar" id="navbar">

        <div class="nav-container">

            <!-- left side -->
            <a
                href="{% url 'home' %}"
                class="brand"
            >

                <div class="brand-logo">

                    <img
                        src="{% static 'images/kritima.jpg' %}"
                        alt="Kritima Shrestha"
                        class="brand-profile-image"
                    >

                </div>

                <div class="brand-text">

                    <span class="brand-name">
                        Kritima Shrestha
                    </span>

                </div>

            </a>


            <!-- navigation -->
            <nav class="nav-links" id="navLinks">

                <a
                    href="{% url 'home' %}"
                    class="nav-link"
                >
                    Home
                </a>


                <a
                    href="{% url 'about' %}"
                    class="nav-link"
                >
                    About
                </a>


                <a
                    href="{% url 'skills' %}"
                    class="nav-link"
                >
                    Skills
                </a>


                <a
                    href="{% url 'home' %}#projects"
                    class="nav-link"
                >
                    Projects
                </a>


                <a
                    href="{% url 'home' %}#experience"
                    class="nav-link"
                >
                    Experience
                </a>


                <a
                    href="{% url 'home' %}#blog"
                    class="nav-link"
                >
                    Blog
                </a>


                <a
                    href="{% url 'home' %}#contact"
                    class="nav-link"
                >
                    Contact
                </a>

            </nav>


            <!-- right side -->
            <div class="nav-actions">

                <!-- theme -->
                <button
                    class="theme-toggle"
                    id="themeToggle"
                    type="button"
                    aria-label="Toggle dark mode"
                    title="Toggle dark mode"
                >
                    <span class="theme-icon">
                        ☾
                    </span>
                </button>


                <!-- contact -->
                <a
                    href="{% url 'home' %}#contact"
                    class="nav-contact-button"
                >
                    Get in touch
                </a>


                <!-- mobile menu -->
                <button
                    class="menu-toggle"
                    id="menuToggle"
                    type="button"
                    aria-label="Open navigation menu"
                    aria-expanded="false"
                    aria-controls="navLinks"
                >
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

            </div>

        </div>

    </header>


    <!-- page content -->
    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- javascript -->
    <script src="{% static 'js/main.js' %}"></script>

    {% block extra_js %}{% endblock %}

</body>

</html>
